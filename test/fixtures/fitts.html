<!doctype html>
<meta charset="utf-8">
<title>pointing trials</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:15px system-ui;background:#fff}
#info{position:absolute;left:12px;top:8px;color:#555;pointer-events:none}
#target{position:absolute;padding:0;margin:0;border:0;border-radius:0;background:#1f6feb;cursor:pointer;font-size:0}
#target.start{background:#2da44e}
</style>
<div id="info">Click the green square to start, then each blue square as it appears.</div>
<button id="target" class="start" type="button" aria-label="Fitts target"></button>
<script src="/rec.js"></script>
<script>
// Sequential pointing trials. Query: n (trials, default 40), seed, d and w
// (comma lists in CSS px). Each trial logs nominal D and W, the distance
// actually travelled from the previous press, the target's extent along the
// movement direction (Wdir), the landing point, pointer entries and times;
// kept in __rec.fitts and sent as a 'fitts' beacon.
(function () {
var q = new URLSearchParams(location.search);
var N = Number(q.get('n') || 40), seed = Number(q.get('seed') || 1);
var Ds = (q.get('d') || '150,300,600,900,1200').split(',').map(Number);
var Ws = (q.get('w') || '12,24,48,96,200').split(',').map(Number);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var R = mulberry32(seed);
var combos = [];
Ds.forEach(function (d) { Ws.forEach(function (w) { combos.push([d, w]); }); });
var seq = [];
while (seq.length < N) {
  var b = combos.slice();
  for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)); var x = b[i]; b[i] = b[j]; b[j] = x; }
  seq = seq.concat(b);
}
seq = seq.slice(0, N);

var rec = window.__rec || (window.__rec = { events: [] });
rec.fitts = [];
var el = document.getElementById('target');
var info = document.getElementById('info');
var trial = -1, cur = null, from = null, started = false, starting = false;

function show(cx, cy, W) {
  el.style.width = el.style.height = W + 'px';
  el.style.left = (cx - W / 2) + 'px';
  el.style.top = (cy - W / 2) + 'px';
}
// Square of side W crossed through its centre along angle a: chord length.
function extentAlong(W, a) {
  var c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  return W / Math.max(c, s);
}
function place(D, W) {
  var vw = innerWidth, vh = innerHeight, m = W / 2 + 8, cx, cy, a;
  for (var k = 0; k < 64; k++) {
    a = R() * 2 * Math.PI;
    cx = from.x + D * Math.cos(a); cy = from.y + D * Math.sin(a);
    if (cx >= m && cx <= vw - m && cy >= m && cy <= vh - m) return { cx: cx, cy: cy };
  }
  // D does not fit this viewport from here: go toward the farthest corner, as far as fits.
  var corners = [[m, m], [vw - m, m], [m, vh - m], [vw - m, vh - m]];
  var best = corners.reduce(function (p, c) { return Math.hypot(c[0] - from.x, c[1] - from.y) > Math.hypot(p[0] - from.x, p[1] - from.y) ? c : p; });
  var far = Math.hypot(best[0] - from.x, best[1] - from.y), d = Math.min(D, far);
  a = Math.atan2(best[1] - from.y, best[0] - from.x);
  return { cx: from.x + d * Math.cos(a), cy: from.y + d * Math.sin(a) };
}
function next() {
  trial++;
  if (trial >= seq.length) {
    el.style.display = 'none';
    info.textContent = 'Done: ' + rec.fitts.length + ' trials.';
    document.documentElement.dataset.fittsDone = '1';
    if (rec.beacon) rec.beacon('fitts-done', { n: rec.fitts.length });
    return;
  }
  var D = seq[trial][0], W = seq[trial][1], p = place(D, W);
  el.className = '';
  show(p.cx, p.cy, W);
  var a = Math.atan2(p.cy - from.y, p.cx - from.x);
  cur = { i: trial, D: D, W: W, Dact: Math.hypot(p.cx - from.x, p.cy - from.y), Wdir: extentAlong(W, a),
    angle: a, from: from, center: { x: p.cx, y: p.cy }, rect: { x: p.cx - W / 2, y: p.cy - W / 2, w: W, h: W },
    tAppear: performance.now(), tFirstMove: null, tLastMove: null, tDown: null, tUp: null,
    moves: 0, enters: 0, landing: null, hit: null };
  el.dataset.trial = String(trial); el.dataset.d = String(D); el.dataset.w = String(W);
  info.textContent = 'Trial ' + (trial + 1) + ' / ' + seq.length;
}
var START_W = 40;
function start() {
  from = { x: innerWidth / 2, y: innerHeight / 2 };
  show(from.x, from.y, START_W);
  el.dataset.trial = 'start';
}

window.addEventListener('pointermove', function (e) {
  if (!cur || cur.tDown != null) return;
  if (cur.tFirstMove == null) cur.tFirstMove = e.timeStamp;
  cur.tLastMove = e.timeStamp; cur.moves++;
}, true);
el.addEventListener('pointerenter', function () { if (cur && cur.tDown == null) cur.enters++; });
window.addEventListener('pointerdown', function (e) {
  if (!started) {
    if (Math.abs(e.clientX - from.x) <= START_W / 2 && Math.abs(e.clientY - from.y) <= START_W / 2) {
      from = { x: e.clientX, y: e.clientY };
      started = starting = true;        // the first trial appears on pointerup
    }
    return;
  }
  if (!cur || cur.tDown != null) return;
  cur.tDown = e.timeStamp;
  cur.landing = { x: e.clientX, y: e.clientY };
  var r = cur.rect;
  cur.hit = e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h;
  cur.offset = { x: (e.clientX - cur.center.x) / cur.W, y: (e.clientY - cur.center.y) / cur.W };
}, true);
window.addEventListener('pointerup', function (e) {
  if (starting) { starting = false; next(); return; }
  if (!cur || cur.tDown == null || cur.tUp != null) return;
  cur.tUp = e.timeStamp;
  rec.fitts.push(cur);
  if (rec.beacon) rec.beacon('fitts', { trial: cur });
  from = cur.landing;
  cur = null;
  next();
}, true);
start();
})();
</script>
