name: Feature request
description: Suggest an improvement to a real workflow.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and what gets in the way. Leave out private account data.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed improvement
      description: What would a useful result look like?
    validations:
      required: true
